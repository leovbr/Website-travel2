<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUSA — My Dashboard</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#f7f3ef;color:#241c1d;font-family:"DM Sans",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 20px}.brand{font:600 30px "Playfair Display",serif;color:#671328}.hero{margin:80px 0 30px}.hero h1{font:500 clamp(42px,7vw,72px) "Playfair Display",serif;margin:8px 0}.card{background:#fff;border:1px solid #e5ddd7;border-radius:18px;padding:22px}.btn,.outline{border-radius:999px;padding:11px 16px;cursor:pointer}.btn{background:#671328;color:#fff;border:0}.outline{background:transparent;border:1px solid #b8aaa1}.muted{opacity:.6;font-size:13px}</style></head><body><main class="wrap"><div class="brand">NUSA</div><section class="hero"><div class="muted">MY DASHBOARD</div><h1 id="hello">Selamat datang.</h1><p class="muted">Akun pengguna NUSA.</p></section><div class="card"><h2>Profil</h2><p id="email" class="muted"></p><button class="outline" onclick="location.href='index.html'">Kembali ke NUSA</button> <button class="btn" onclick="logout()">Keluar</button></div></main><script>function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}const s=get('nusa_session_v2',null);if(!s){location.href='index.html'}else{document.getElementById('hello').textContent='Selamat datang, '+s.name+'.';document.getElementById('email').textContent=s.email||''}function logout(){localStorage.removeItem('nusa_session_v2');location.href='index.html'}</script></body></html>
