<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUSA — Owner Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#f7f3ef;color:#241c1d;font-family:"DM Sans",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font:600 30px "Playfair Display",serif;color:#671328}.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.hero{margin:70px 0 30px}.hero h1{font:500 clamp(42px,7vw,76px) "Playfair Display",serif;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#fff;border:1px solid #e5ddd7;border-radius:18px;padding:22px;min-height:130px}.card h3{margin:0 0 8px;font:500 24px "Playfair Display",serif}.btn{border:0;border-radius:999px;padding:12px 18px;background:#671328;color:#fff;cursor:pointer}.outline{border:1px solid #b8aaa1;border-radius:999px;padding:11px 16px;background:transparent;cursor:pointer}.muted{opacity:.6;font-size:13px}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">NUSA</div><div class="badge">Owner Dashboard</div></div><button class="outline" onclick="logoutOwner()">Keluar</button></div><section class="hero"><div class="badge">Private management</div><h1 id="hello">Selamat datang.</h1><p class="muted">Kelola katalog NUSA dari satu tempat.</p></section><section class="grid"><div class="card"><h3>Destinasi</h3><p class="muted">Kelola foto dan katalog destinasi.</p><button class="outline" onclick="location.href='owner-catalog-v2.html'">Kelola</button></div><div class="card"><h3>Penginapan</h3><p class="muted">Hotel, villa, motel, resort.</p><button class="outline" onclick="location.href='owner-catalog-v2.html'">Kelola foto</button></div><div class="card"><h3>Transportasi</h3><p class="muted">Pesawat, kapal, kereta, bus.</p><button class="outline" onclick="location.href='owner-catalog-v2.html'">Kelola foto</button></div><div class="card"><h3>Owner Account</h3><p class="muted">Data owner tersimpan lokal untuk demo.</p></div></section></main><script>function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}const s=get('nusa_owner_session_v2',null);if(!s){location.href='index.html'}else{document.getElementById('hello').textContent='Selamat datang, '+s.name+'.'}function logoutOwner(){localStorage.removeItem('nusa_owner_session_v2');location.href='index.html'}</script></body></html>
